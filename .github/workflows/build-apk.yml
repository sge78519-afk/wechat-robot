name: Build APK

on:
  push:
    branches: [master, main, "7.0.21_1800"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK (with system JDK)
        run: |
          # 切换到系统 JDK（sdkmanager 需要 JDK 17+）
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          java -version 2>&1 | head -1
          
          # Accept licenses
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT 2>/dev/null || true
          
          # Install required SDK components
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-29" "build-tools;29.0.3"

      - name: Set up JDK 11 (for Gradle 6.5)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-robot-apk
          path: app/build/outputs/apk/release/*.apk
